# Kernel network tuning for the tunnel — apply on BOTH the exit and the Iran
# relay. Install with:
#   sudo cp sysctl-tuning.conf /etc/sysctl.d/99-tunnel.conf
#   sudo modprobe tcp_bbr && echo tcp_bbr | sudo tee /etc/modules-load.d/bbr.conf
#   sudo sysctl --system
#
# Why: the tunnel carries one TCP stream per mux session. On a lossy WAN
# (Iran <-> abroad) the default CUBIC congestion control collapses a single
# stream's throughput on ~1% loss; BBR is loss-tolerant and keeps it high.
# Bigger socket buffers let a single stream fill the bandwidth-delay product.

# Loss-tolerant congestion control (biggest single-user speed win under loss).
net.core.default_qdisc = fq
net.ipv4.tcp_congestion_control = bbr

# Large socket buffers for high bandwidth-delay-product links.
net.core.rmem_max = 67108864
net.core.wmem_max = 67108864
net.ipv4.tcp_rmem = 4096 87380 67108864
net.ipv4.tcp_wmem = 4096 65536 67108864

# Room for many concurrent sockets (300 users + their mux sessions).
net.ipv4.ip_local_port_range = 1024 65535
net.core.somaxconn = 4096
net.ipv4.tcp_max_syn_backlog = 8192
net.nf_conntrack_max = 262144
